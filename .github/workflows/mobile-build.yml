name: LernWerk mobile test builds
on:
  workflow_dispatch:
    inputs:
      build_ios_simulator:
        description: Build iOS Simulator only when explicitly requested by the user
        required: false
        type: boolean
        default: false
      build_signed_ios_ipa:
        description: Build a device-installable IPA using the Apple signing secrets configured in the repository
        required: false
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lernwerk-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Bundle app and native TTS plugin
        run: npm run build:web
      - name: Generate Android project
        run: npx cap add android
      - name: Sync web assets
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Verify APK package and signature
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -q "package: name='de.lernwerk.dtz'" "$RUNNER_TEMP/apk-badging.txt"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK" | tee "$RUNNER_TEMP/apk-sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: lernwerk-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    name: iOS Simulator build (not a device IPA)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ios_simulator }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Bundle app and native TTS plugin
        run: npm run build:web
      - name: Generate iOS project
        run: npx cap add ios
      - name: Sync web assets
        run: npx cap sync ios
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/LernWerkDerived" \
            CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/LernWerkDerived/Build/Products/Debug-iphonesimulator/App.app" \
            "$RUNNER_TEMP/LernWerk-iOS-Simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: lernwerk-ios-simulator-app
          path: ${{ runner.temp }}/LernWerk-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14

  ios-device-ipa:
    name: Signed iOS device IPA (TestFlight/App Store distribution)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_ios_ipa }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Bundle app and native TTS plugin
        run: npm run build:web
      - name: Generate iOS project
        run: npx cap add ios
      - name: Sync web assets
        run: npx cap sync ios
      - name: Import Apple signing credentials
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE_BASE64"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_API_KEY_BASE64"
          test -n "$APPLE_API_KEY_ID"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$KEYCHAIN_PASSWORD" > "$RUNNER_TEMP/keychain-password"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/lernwerk.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/lernwerk.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/lernwerk.keychain-db"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/apple-distribution.p12"
          security import "$RUNNER_TEMP/apple-distribution.p12" -k "$RUNNER_TEMP/lernwerk.keychain-db" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/lernwerk.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/lernwerk.keychain-db" login.keychain-db
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
      - name: Archive signed iOS app
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER_ID"
          test -n "$APPLE_TEAM_ID"
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LernWerk.xcarchive" \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LernWerk.xcarchive" \
            -exportPath "$RUNNER_TEMP/LernWerkIPA" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID" \
            -allowProvisioningUpdates
      - uses: actions/upload-artifact@v4
        with:
          name: lernwerk-signed-ios-ipa
          path: ${{ runner.temp }}/LernWerkIPA/*.ipa
          if-no-files-found: error
          retention-days: 14
